name: release

# Packages the game for every platform the engine is released for and attaches the archives to a
# GitHub release. Copied into every project made from this template (the template repository
# itself is not a buildable game, so the job is skipped there).
#
#   git tag v0.0.2 && git push origin v0.0.2
#
# The tag must match "version" in noi_engine.proj.json. The engine and the resources compiler are
# downloaded from their releases, at the versions the project declares.

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to publish (ex: v0.0.2)'
        required: true

permissions:
  contents: write

jobs:
  package:
    if: github.repository != 'noi-engine/template-basic-2d'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_os: linux
            artifact_arch: x64
          - os: macos-latest
            artifact_os: macos
            artifact_arch: arm64
          # Enable once noi_engine publishes a Windows build (its release workflow has it disabled):
          # - os: windows-latest
          #   artifact_os: windows
          #   artifact_arch: x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Read noi_engine.proj.json and check the tag
        id: project
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version noi_engine.proj.json)
          TAG="${{ github.event_name == 'push' && github.ref_name || inputs.tag_name }}"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Tag $TAG does not match noi_engine.proj.json version $VERSION" >&2
            exit 1
          fi
          echo "engine=$(jq -r .engine_version noi_engine.proj.json)" >> "$GITHUB_OUTPUT"
          echo "compiler=$(jq -r .resources_compiler_version noi_engine.proj.json)" >> "$GITHUB_OUTPUT"

      - name: Install CMake, Ninja, Python
        uses: lukka/get-cmake@latest

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install clang and flatc (the resources compiler needs it)
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y clang flatbuffers-compiler
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install flatbuffers
          fi
          flatc --version

      - name: Download noi_engine ${{ steps.project.outputs.engine }}
        shell: bash
        run: |
          set -euo pipefail
          ASSET="noi_engine-${{ matrix.artifact_os }}-${{ matrix.artifact_arch }}-release.zip"
          curl -fsSL -o engine.zip "https://github.com/noi-engine/noi_engine/releases/download/v${{ steps.project.outputs.engine }}/${ASSET}"
          unzip -q engine.zip -d engine_tmp
          mv engine_tmp/noi_engine .noi_engine

      - name: Download resources_compiler ${{ steps.project.outputs.compiler }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o compiler.zip "https://github.com/noi-engine/resources_compiler/releases/download/v${{ steps.project.outputs.compiler }}/resources_compiler.zip"
          unzip -q compiler.zip -d compiler_tmp
          mv compiler_tmp/resources_compiler .resources_compiler

      - name: Configure
        run: cmake --preset release

      - name: Build and package
        run: cmake --build --preset release --target package

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-${{ matrix.artifact_os }}-${{ matrix.artifact_arch }}
          path: build/release/packages/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || inputs.tag_name }}
          name: ${{ github.event_name == 'push' && github.ref_name || inputs.tag_name }}
          generate_release_notes: true
          files: dist/*
